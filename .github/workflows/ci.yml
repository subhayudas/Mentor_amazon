name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check, unit tests, i18n parity, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only: Vite inlines these at build time and the runtime is
      # never exercised here. Real values live in the Vercel project settings.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run check

      - name: Unit tests (vitest, no database)
        run: npm test

      - name: Locale parity and t() key usage
        run: npm run check:i18n

      - name: Build (vite)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  db-integration:
    name: Database integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      - name: Start the local stack (retried once on an image-pull failure)
        run: |
          EXCLUDE=studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase start -x "$EXCLUDE" || { supabase stop --no-backup || true; sleep 10; supabase start -x "$EXCLUDE"; }

      - name: Export the stack's (local demo) keys
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; source "$RUNNER_TEMP/supabase.env"; set +a
          {
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_TEST_DB_URL=$DB_URL"
            echo "TZ=UTC"
          } >> "$GITHUB_ENV"

      - name: Build the schema (drizzle push → v2 → phase2 → 0002 → 0003 → 0004)
        run: bash scripts/db/reset-local.sh

      - name: Integration suites
        run: npm run test:integration

      - name: Migration idempotency and re-run chain
        run: bash scripts/db/verify-idempotency.sh

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true
