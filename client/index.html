<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noimageindex, noarchive" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Ancizar+Serif:ital,wght@0,400;0,700;1,400&family=Averia+Serif+Libre:wght@300;400&family=Noto+Sans+Arabic:wght@400..600&display=swap" rel="stylesheet">
    <title>MentorConnect — Amazon mentorship</title>
    <meta name="description" content="Find an Amazon mentor, send a request with your goal, and pick a time together once they accept.">
  </head>
  <body>
    <div id="root">
      <!-- Shown only until the app mounts (the backend probe in main.tsx takes up to a few seconds against a dead project). -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#565959;font-size:15px">
        <span style="display:inline-flex;align-items:center;gap:10px"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #d5d9d9;border-top-color:#ff9900;animation:mc-spin .8s linear infinite"></span>MentorConnect</span>
      </div>
      <style>@keyframes mc-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
